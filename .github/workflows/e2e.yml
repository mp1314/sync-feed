name: E2E Node Test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Test nodes end to end
        env:
          SUB_B64: ${{ secrets.SUB_B64 }}
        run: |
          curl -sL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip"
          unzip -o -q xray.zip xray && chmod +x xray
          cat > test.py <<'PY'
          import base64, json, os, subprocess, time, urllib.parse, urllib.request
          raw = base64.b64decode(os.environ["SUB_B64"])
          try:
              dec = base64.b64decode(raw + b"=" * (-len(raw) % 4)).decode("utf-8", "replace")
              if "vless://" in dec: raw = dec.encode()
          except Exception: pass
          lines = [l for l in raw.decode("utf-8", "replace").splitlines() if l.strip()]
          print(f"subscription nodes: {len(lines)}")
          def cfg_for(line, port):
              u = urllib.parse.urlparse(line); q = urllib.parse.parse_qs(u.query)
              return {"log": {"loglevel": "warning"},
                "inbounds": [{"listen": "127.0.0.1", "port": port, "protocol": "socks", "settings": {"udp": False}}],
                "outbounds": [{"protocol": "vless",
                  "settings": {"vnext": [{"address": u.hostname, "port": u.port or 443, "users": [{"id": u.username, "encryption": "none"}]}]},
                  "streamSettings": {"network": "ws", "security": "tls",
                    "tlsSettings": {"serverName": q.get("sni", [u.hostname])[0], "fingerprint": "chrome"},
                    "wsSettings": {"path": urllib.parse.unquote(q.get("path", ["/"])[0]), "host": q.get("host", [u.hostname])[0]}}}]}
          ok = 0
          first = urllib.parse.urlparse(lines[0]); fq = urllib.parse.parse_qs(first.query)
          control = f"vless://{first.username}@{first.hostname}:{first.port or 443}?security=tls&type=ws&host={fq.get('host',[''])[0]}&sni={fq.get('sni',[''])[0]}&fp=chrome&path=%2F#control-plain"
          lines = [control] + lines[:12]
          for idx, line in enumerate(lines):
              port = 12100 + idx
              open("xc.json", "w").write(json.dumps(cfg_for(line, port)))
              err = open("xerr.log", "wb") if idx <= 1 else subprocess.DEVNULL
              p = subprocess.Popen(["./xray", "run", "-c", "xc.json"], stdout=subprocess.DEVNULL, stderr=err)
              time.sleep(2.5)
              remark = urllib.parse.unquote(line.split("#")[-1]) if "#" in line else ""
              try:
                  r = subprocess.run(["curl", "-s", "-m", "35", "--socks5-hostname", f"127.0.0.1:{port}", "-o", "/dev/null", "-w", "%{http_code}", "https://www.google.com/generate_204"], capture_output=True, text=True, timeout=45)
                  code = r.stdout.strip()
              except Exception as e:
                  code = f"ERR"
              exitinfo = ""
              if code == "204":
                  ok += 1
                  try:
                      r2 = subprocess.run(["curl", "-s", "-m", "35", "--socks5-hostname", f"127.0.0.1:{port}", "http://ip-api.com/json/?fields=country,city,org,query"], capture_output=True, text=True, timeout=45)
                      j = json.loads(r2.stdout)
                      exitinfo = f"exit={j.get('query')} {j.get('country')}/{j.get('city')} org={j.get('org')}"
                  except Exception:
                      exitinfo = "exit lookup failed"
              print(f"node {idx} [{remark}] google204={code} {exitinfo}", flush=True)
              if idx <= 1:
                  try:
                      err.close(); print("xray log tail:", open("xerr.log").read()[-600:], flush=True)
                  except Exception as e: print("no xray log", e)
              p.terminate()
              try: p.wait(timeout=5)
              except Exception: p.kill()
          print(f"SUMMARY working {ok}/13 (incl control)")
          PY
          python3 test.py
