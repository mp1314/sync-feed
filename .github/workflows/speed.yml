name: Node Speed Test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Control measurements
        env:
          SUB_B64: ${{ secrets.SUB_B64 }}
        run: |
          curl -sL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip"
          unzip -o -q xray.zip xray && chmod +x xray
          cat > test.py <<'PY'
          import base64, json, os, subprocess, time, urllib.parse
          raw = base64.b64decode(os.environ["SUB_B64"])
          dec = base64.b64decode(raw + b"=" * (-len(raw) % 4)).decode("utf-8", "replace")
          lines = [l for l in dec.splitlines() if l.strip()]
          def cfg_for(line, port):
              u = urllib.parse.urlparse(line); q = urllib.parse.parse_qs(u.query)
              return {"log": {"loglevel": "none"},
                "inbounds": [{"listen": "127.0.0.1", "port": port, "protocol": "socks", "settings": {"udp": False}}],
                "outbounds": [{"protocol": "vless",
                  "settings": {"vnext": [{"address": u.hostname, "port": u.port or 443, "users": [{"id": u.username, "encryption": "none"}]}]},
                  "streamSettings": {"network": "ws", "security": "tls",
                    "tlsSettings": {"serverName": q.get("sni", [u.hostname])[0], "fingerprint": "chrome"},
                    "wsSettings": {"path": urllib.parse.unquote(q.get("path", ["/"])[0]), "host": q.get("host", [u.hostname])[0]}}}]}
          def dl(port, parallel=1):
              if parallel == 1:
                  r = subprocess.run(["curl", "-s", "-m", "25", "--socks5-hostname", f"127.0.0.1:{port}", "-o", "/dev/null", "-w", "%{speed_download} %{time_starttransfer}", "https://speed.cloudflare.com/__down?bytes=3000000"], capture_output=True, text=True, timeout=35)
                  pp = r.stdout.split()
                  return f"{float(pp[0])*8/1e6:.1f} Mbps ttfb={pp[1] if len(pp)>1 else '?'}s"
              procs = [subprocess.Popen(["curl", "-s", "-m", "25", "--socks5-hostname", f"127.0.0.1:{port}", "-o", "/dev/null", "-w", "%{speed_download}", "https://speed.cloudflare.com/__down?bytes=3000000"], stdout=subprocess.PIPE, text=True) for _ in range(parallel)]
              tot = 0.0
              for pr in procs:
                  out, _ = pr.communicate(timeout=40); tot += float(out.strip() or 0)
              return f"aggregate {tot*8/1e6:.1f} Mbps"
          r = subprocess.run(["curl", "-s", "-m", "20", "-o", "/dev/null", "-w", "%{speed_download} %{time_starttransfer}", "https://speed.cloudflare.com/__down?bytes=3000000"], capture_output=True, text=True)
          pp = r.stdout.split(); print(f"BASELINE direct: {float(pp[0])*8/1e6:.1f} Mbps ttfb={pp[1]}s", flush=True)
          first = urllib.parse.urlparse(lines[0]); fq = urllib.parse.parse_qs(first.query)
          plain = f"vless://{first.username}@104.21.75.54:443?security=tls&type=ws&host={fq.get('host',[''])[0]}&sni={fq.get('sni',[''])[0]}&fp=chrome&path=%2F#plain"
          for label, line, port, par in (("CHAIN node10 x1", lines[9], 15201, 1),):
              open("xc.json", "w").write(json.dumps(cfg_for(line, port)))
              p = subprocess.Popen(["./xray", "run", "-c", "xc.json"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              time.sleep(2.5)
              print(f"{label}: {dl(port, par)}", flush=True)
              # interval sampling on same node: 15MB download, size polled every 5s
              open("xc.json", "w").write(json.dumps(cfg_for(lines[9], 15209)))
              p2 = subprocess.Popen(["./xray", "run", "-c", "xc.json"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              time.sleep(2.5)
              dlp = subprocess.Popen(["curl", "-s", "-m", "50", "--socks5-hostname", "127.0.0.1:15209", "-o", "big.bin", "https://speed.cloudflare.com/__down?bytes=15000000"])
              prev = 0; t0 = time.time()
              for k in range(8):
                  time.sleep(5)
                  cur = os.path.getsize("big.bin") if os.path.exists("big.bin") else 0
                  print(f"  t+{5*(k+1)}s interval {(cur-prev)*8/5/1e6:.1f} Mbps (total {cur/1e6:.1f} MB)", flush=True)
                  prev = cur
                  if dlp.poll() is not None: break
              try: dlp.terminate()
              except Exception: pass
              p2.terminate()
              try: p2.wait(timeout=5)
              except Exception: p2.kill()
              p.terminate()
              try: p.wait(timeout=5)
              except Exception: p.kill()
          PY
          python3 test.py
