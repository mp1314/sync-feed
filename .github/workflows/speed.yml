name: Node Speed Test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Measure node throughput
        env:
          SUB_B64: ${{ secrets.SUB_B64 }}
        run: |
          curl -sL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip"
          unzip -o -q xray.zip xray && chmod +x xray
          cat > test.py <<'PY'
          import base64, json, os, subprocess, time, urllib.parse
          raw = base64.b64decode(os.environ["SUB_B64"])
          dec = base64.b64decode(raw + b"=" * (-len(raw) % 4)).decode("utf-8", "replace")
          lines = [l for l in dec.splitlines() if l.strip()]
          print(f"nodes: {len(lines)}")
          def cfg_for(line, port):
              u = urllib.parse.urlparse(line); q = urllib.parse.parse_qs(u.query)
              return {"log": {"loglevel": "none"},
                "inbounds": [{"listen": "127.0.0.1", "port": port, "protocol": "socks", "settings": {"udp": False}}],
                "outbounds": [{"protocol": "vless",
                  "settings": {"vnext": [{"address": u.hostname, "port": u.port or 443, "users": [{"id": u.username, "encryption": "none"}]}]},
                  "streamSettings": {"network": "ws", "security": "tls",
                    "tlsSettings": {"serverName": q.get("sni", [u.hostname])[0], "fingerprint": "chrome"},
                    "wsSettings": {"path": urllib.parse.unquote(q.get("path", ["/"])[0]), "host": q.get("host", [u.hostname])[0]}}}]}
          for idx, line in enumerate(lines[:10]):
              port = 15100 + idx
              open("xc.json", "w").write(json.dumps(cfg_for(line, port)))
              p = subprocess.Popen(["./xray", "run", "-c", "xc.json"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              time.sleep(2.5)
              remark = urllib.parse.unquote(line.split("#")[-1]) if "#" in line else ""
              try:
                  r = subprocess.run(["curl", "-s", "-m", "25", "--socks5-hostname", f"127.0.0.1:{port}", "-o", "/dev/null", "-w", "%{speed_download} %{time_starttransfer}", "https://speed.cloudflare.com/__down?bytes=3000000"], capture_output=True, text=True, timeout=35)
                  parts = r.stdout.split()
                  spd = float(parts[0]) * 8 / 1e6 if parts else 0
                  ttfb = parts[1] if len(parts) > 1 else "?"
                  print(f"node {idx+1} [{remark}] {spd:.1f} Mbps ttfb={ttfb}s", flush=True)
              except Exception as e:
                  print(f"node {idx+1} [{remark}] ERR", flush=True)
              p.terminate()
              try: p.wait(timeout=5)
              except Exception: p.kill()
          PY
          python3 test.py
