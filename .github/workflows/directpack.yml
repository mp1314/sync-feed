name: Direct Pack Builder
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test direct configs
        env:
          CHECK_WORKER: ${{ secrets.DOMAIN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openvpn > /dev/null 2>&1
          pip install -q requests
          cat > build.py <<'PY'
          import base64, json, os, subprocess, sys, time
          sys.path.insert(0, ".")
          import requests, vpngate
          cfg = vpngate.Config.from_env()
          session = requests.Session()
          rows, source = vpngate.fetch_servers(cfg, session)
          nodes = vpngate.to_sstp_nodes(rows)
          cfg_map = {}
          for row in rows:
              h = (row.get("host") or "").strip().lower()
              if "." not in h: h = h + ".opengw.net"
              if row.get("config_b64"): cfg_map[h] = row["config_b64"]
          jp = [n for n in nodes if n.country_code == "JP"]
          print(f"source={source} total={len(nodes)} JP={len(jp)}", flush=True)
          results = vpngate.check_all(jp, session, cfg, limit=0) if hasattr(vpngate, "check_all") else None
          if results is None:
              results = [vpngate.check_one(n, session, cfg.worker_base, cfg.check_timeout) for n in jp]
          ok = [r for r in results if r.get("success") and r.get("host") in cfg_map]
          ok.sort(key=lambda r: (r.get("residential") != "residential", r.get("speed") is None, -(r.get("speed") or 0)))
          print("checked ok with config:", [(r["host"], r.get("residential"), (r.get("speed") or 0)//1000000) for r in ok], flush=True)
          top = ok[:6]
          os.makedirs("pack", exist_ok=True)
          out = []
          for i, r in enumerate(top, 1):
              host = r["host"]
              ovpn = base64.b64decode(cfg_map[host]).decode("utf-8", "replace")
              path = f"pack/jp-{i:02d}.ovpn"
              open(path, "w").write(ovpn)
              open("pass.txt", "w").write("vpn\nvpn\n")
              subprocess.run(["sudo", "rm", "-f", "ovpn.log"], capture_output=True)
              subprocess.run(["sudo", "openvpn", "--config", path, "--auth-user-pass", "pass.txt",
                              "--connect-timeout", "15", "--connect-retry-max", "1", "--resolv-retry", "2",
                              "--data-ciphers", "AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305:BF-CBC",
                              "--data-ciphers-fallback", "BF-CBC",
                              "--daemon", "--log", "ovpn.log", "--writepid", "ovpn.pid"], capture_output=True)
              def readlog():
                  try: return subprocess.run(["sudo", "cat", "ovpn.log"], capture_output=True, text=True, timeout=10).stdout
                  except Exception: return ""
              good = False
              for _ in range(24):
                  time.sleep(2.5)
                  if "Initialization Sequence Completed" in readlog(): good = True; break
              if not good:
                  print(f"{host}: CONNECT FAIL {readlog()[-150:]}".replace("\n", " "), flush=True)
                  out.append((host, r.get("residential"), (r.get("speed") or 0)//1000000, "connect-fail", ""))
              else:
                  time.sleep(2)
                  try: ip = subprocess.run(["curl", "-s", "-m", "15", "https://ifconfig.me"], capture_output=True, text=True, timeout=20).stdout.strip()
                  except Exception: ip = "?"
                  try:
                      rr = subprocess.run(["curl", "-s", "-m", "25", "-o", "/dev/null", "-w", "%{speed_download} %{time_starttransfer}", "https://speed.cloudflare.com/__down?bytes=3000000"], capture_output=True, text=True, timeout=35)
                      pp = rr.stdout.split(); spd = f"{float(pp[0])*8/1e6:.1f} Mbps ttfb={pp[1]}s" if pp else "?"
                  except Exception: spd = "?"
                  print(f"{host}: OK exit={ip} speed={spd}", flush=True)
                  out.append((host, r.get("residential"), (r.get("speed") or 0)//1000000, "ok", f"exit={ip} {spd}"))
              try:
                  pid = subprocess.run(["sudo", "cat", "ovpn.pid"], capture_output=True, text=True).stdout.strip()
                  subprocess.run(["sudo", "kill", pid], capture_output=True)
              except Exception: pass
              subprocess.run(["sudo", "pkill", "-f", "openvpn --config"], capture_output=True)
              time.sleep(3)
          open("pack/results.txt", "w").write("\n".join(f"{h}\t{k}\t{s}Mbps\t{st}\t{d}" for h, k, s, st, d in out))
          print("done", flush=True)
          PY
          python3 build.py
      - name: Upload pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-pack
          path: pack/
