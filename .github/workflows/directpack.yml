name: Direct Pack Builder
on: workflow_dispatch
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build and test direct configs
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openvpn > /dev/null 2>&1
          openvpn --version | head -1
          cat > build.py <<'PY'
          import base64, csv, io, json, subprocess, time, urllib.request, os, sys
          def fetch(url, timeout=60):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(req, timeout=timeout).read()
          data = json.loads(fetch("https://mp1314.github.io/sync-feed/data.json"))
          jp = (data.get("countries") or {}).get("JP", {})
          hosts = [n["host"] for n in jp.get("nodes", []) if n.get("residential") == "residential"][:12]
          print("candidate hosts:", hosts, flush=True)
          configs = {}
          for attempt in range(8):
              raw = fetch("https://www.vpngate.net/api/iphone/").decode("utf-8", "replace")
              header = None
              for line in raw.splitlines():
                  if line.startswith("*"): continue
                  if line.startswith("#"):
                      header = [h.strip().lower() for h in line[1:].split(",")]; continue
                  if header and line:
                      try: fields = next(csv.reader(io.StringIO(line)))
                      except Exception: continue
                      d = dict(zip(header, fields))
                      hn = (d.get("hostname") or "").strip().lower()
                      if "." not in hn: hn = hn + ".opengw.net"
                      if d.get("openvpn_configdata_base64"):
                          configs[hn] = d["openvpn_configdata_base64"]
              covered = [h for h in hosts if h in configs]
              print(f"fetch {attempt+1}: total configs {len(configs)}, covered {len(covered)}/12", flush=True)
              if len(covered) >= 6: break
              time.sleep(3)
          print("parsed header:", header, flush=True)
          print("sample api hosts:", list(configs.keys())[:5], "total rows with config:", len(configs), flush=True)
          print("configs found:", [h for h in hosts if h in configs], flush=True)
          os.makedirs("pack", exist_ok=True)
          results = []
          hosts = [h for h in hosts if h in configs][:6]
          for i, host in enumerate(hosts, 1):
              b64 = configs.get(host)
              if not b64:
                  print(f"{host}: no config", flush=True); continue
              try:
                  ovpn = base64.b64decode(b64).decode("utf-8", "replace")
              except Exception:
                  print(f"{host}: bad b64", flush=True); continue
              path = f"pack/jp-{i:02d}.ovpn"
              open(path, "w").write(ovpn)
              open("pass.txt", "w").write("vpn\nvpn\n")
              if os.path.exists("ovpn.log"): os.remove("ovpn.log")
              subprocess.run(["sudo", "openvpn", "--config", path, "--auth-user-pass", "pass.txt",
                              "--connect-timeout", "15", "--connect-retry-max", "1", "--resolv-retry", "2",
                              "--data-ciphers", "AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305:BF-CBC",
                              "--data-ciphers-fallback", "BF-CBC",
                              "--daemon", "--log", "ovpn.log", "--writepid", "ovpn.pid"], capture_output=True)
              ok = False
              for _ in range(24):
                  time.sleep(2.5)
                  if os.path.exists("ovpn.log") and "Initialization Sequence Completed" in open("ovpn.log", errors="replace").read():
                      ok = True; break
              if not ok:
                  tail = open("ovpn.log", errors="replace").read()[-200:].replace("\n", " ") if os.path.exists("ovpn.log") else ""
                  print(f"{host}: CONNECT FAIL {tail}", flush=True)
                  results.append((host, "fail", ""))
              else:
                  time.sleep(2)
                  try:
                      ip = subprocess.run(["curl", "-s", "-m", "15", "https://ifconfig.me"], capture_output=True, text=True, timeout=20).stdout.strip()
                  except Exception: ip = "?"
                  try:
                      r = subprocess.run(["curl", "-s", "-m", "25", "-o", "/dev/null", "-w", "%{speed_download} %{time_starttransfer}", "https://speed.cloudflare.com/__down?bytes=3000000"], capture_output=True, text=True, timeout=35)
                      pp = r.stdout.split(); spd = f"{float(pp[0])*8/1e6:.1f} Mbps ttfb={pp[1]}s" if pp else "?"
                  except Exception: spd = "?"
                  print(f"{host}: OK exit={ip} speed={spd}", flush=True)
                  results.append((host, "ok", f"exit={ip} {spd}"))
              try:
                  pid = open("ovpn.pid").read().strip()
                  subprocess.run(["sudo", "kill", pid], capture_output=True)
              except Exception: pass
              subprocess.run(["sudo", "pkill", "-f", "openvpn --config"], capture_output=True)
              time.sleep(3)
          open("pack/results.txt", "w").write("\n".join(f"{h}\t{s}\t{d}" for h, s, d in results))
          print("done", flush=True)
          PY
          python3 build.py
      - name: Upload pack
        uses: actions/upload-artifact@v4
        with:
          name: direct-pack
          path: pack/
